# Theme metadata
name = "Paper and green"

[light]
  # Primary — deeper forest green for buttons/active states
  primary = "#2f5d3f"

  # Menu
  menu_primary = "#f4f2ed"     # warm linen navbar
  menu_text = "#1c1c1c"        # warm charcoal
  menu_text_active = "#1c1c1c" # deep forest for active
  menu_title = "#1c1c1c"

  # Links — ochre/terracotta
  link = "#2f5d3f"
  link_hover = "#22452e"
  link_decoration = "none"

  # Home sections — warmer paper tones
  home_section_odd = "#f4f2ed"   # warm taupe-paper
  home_section_even = "#f4f2ed"  # lighter warm off-white
  background = "#f4f2ed"
