# Theme metadata
name = "Misty Forest Minimalist"

[light]
  # Primary — deeper forest green for buttons/active states
  primary = "#3d5c47"

  # Menu
  menu_primary = "#e8e2d8"     # warm linen navbar
  menu_text = "#4a4540"        # warm charcoal
  menu_text_active = "#1f3327" # deep forest for active
  menu_title = "#4a4540"

  # Links — ochre/terracotta
  link = "#a06830"
  link_hover = "#7a4e22"
  link_decoration = "none"

  # Home sections — warmer paper tones
  home_section_odd = "#e8e2d8"   # warm taupe-paper
  home_section_even = "#f0ebe0"  # lighter warm off-white
  background = "#e8e2d8"
